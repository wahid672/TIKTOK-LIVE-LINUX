<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>TikTok LIVE Stream Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      cursor: none !important; /* Hide mouse cursor completely on stream output */
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 25%, #1e1b4b 0%, #09090b 70%, #030712 100%);
      font-family: 'Outfit', sans-serif;
      color: #f8fafc;
      position: relative;
    }

    /* Ambient Background Glow */
    .ambient-glow-1 {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.22) 0%, transparent 70%);
      filter: blur(50px);
      z-index: 1;
      pointer-events: none;
    }

    .ambient-glow-2 {
      position: absolute;
      bottom: 25%;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, transparent 70%);
      filter: blur(60px);
      z-index: 1;
      pointer-events: none;
    }

    /* Canvas Elements Layer */
    #overlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
    }

    .canvas-item {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: top 0.2s ease, left 0.2s ease, width 0.2s ease, height 0.2s ease;
      box-sizing: border-box;
    }

    /* Element: Header (Live Pill & Title) */
    .overlay-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: center;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      padding: 5px 16px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
    }

    .pulse-dot {
      width: 9px;
      height: 9px;
      background-color: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 10px #ef4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    .live-text {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fca5a5;
      text-transform: uppercase;
    }

    .stream-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #ffffff 40%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 8px 24px rgba(192, 132, 252, 0.25);
      line-height: 1.25;
      max-width: 95%;
      word-break: break-word;
    }

    /* Element: Clock & Visualizer Waves */
    .center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      height: 100%;
    }

    .clock-display {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
      line-height: 1;
    }

    .wave-container {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 38px;
    }

    .wave-bar {
      width: 5px;
      background: linear-gradient(180deg, #a855f7, #38bdf8);
      border-radius: 999px;
      animation: wave 1.2s ease-in-out infinite alternate;
    }

    .wave-bar:nth-child(1) { height: 18px; animation-delay: 0.1s; }
    .wave-bar:nth-child(2) { height: 34px; animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { height: 24px; animation-delay: 0.4s; }
    .wave-bar:nth-child(4) { height: 38px; animation-delay: 0.3s; }
    .wave-bar:nth-child(5) { height: 22px; animation-delay: 0.5s; }
    .wave-bar:nth-child(6) { height: 32px; animation-delay: 0.15s; }
    .wave-bar:nth-child(7) { height: 16px; animation-delay: 0.35s; }

    @keyframes wave {
      0% { transform: scaleY(0.4); }
      100% { transform: scaleY(1.3); }
    }

    /* Element: Glass Banner / Card */
    .banner-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 10px 16px;
      backdrop-filter: blur(16px);
      text-align: center;
      box-shadow: 0 10px 25px -10px rgba(0, 0, 0, 0.5);
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .banner-title {
      font-weight: 700;
      font-size: 15px;
      color: #38bdf8;
      line-height: 1.2;
      margin-bottom: 2px;
    }

    .banner-sub {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.2;
    }

    /* Element: Custom Static Text */
    .custom-text-box {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 12px;
      text-align: center;
      font-weight: 700;
      line-height: 1.25;
      word-break: break-word;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    /* Element: Marquee Running Text */
    .marquee-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      border-radius: 12px;
      padding: 0 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
    }

    .marquee-track {
      display: inline-flex;
      align-items: center;
      padding-left: 100%;
      animation: marquee-anim 16s linear infinite;
      font-weight: 600;
      font-size: 14px;
    }

    .marquee-spacer {
      margin: 0 16px;
      color: #f43f5e;
      font-size: 12px;
    }

    @keyframes marquee-anim {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <!-- Dynamic Canvas Elements Layer -->
  <div id="overlayCanvas"></div>

  <script>
    // Live Clock State
    let clockInterval = null;
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const el = document.getElementById('liveClockDisplay');
      if (el) el.textContent = `${h}:${m}:${s}`;
    }

    // Default Fallback Elements
    const DEFAULT_LAYOUT = {
      elements: [
        {
          id: "el_header",
          type: "header",
          title: "TIKTOK LIVE",
          subtitle: "Live Broadcast",
          x: 5, y: 12, w: 90, h: 9,
          fontSize: 24,
          color: "#ffffff",
          bgColor: "rgba(0, 0, 0, 0)",
          visible: true
        },
        {
          id: "el_clock",
          type: "clock",
          title: "Jam & Wave",
          subtitle: "",
          x: 10, y: 38, w: 80, h: 14,
          fontSize: 44,
          color: "#ffffff",
          bgColor: "rgba(0, 0, 0, 0)",
          visible: true
        },
        {
          id: "el_footer",
          type: "banner",
          title: "✨ Selamat Datang di Siaran Live!",
          subtitle: "Tap-tap layar & tinggalkan komentar ya!",
          x: 5, y: 66, "w": 90, "h": 9,
          fontSize: 15,
          color: "#38bdf8",
          bgColor: "rgba(30, 41, 59, 0.7)",
          visible: true
        }
      ]
    };

    const canvas = document.getElementById('overlayCanvas');
    const urlParams = new URLSearchParams(window.location.search);
    const queryTitle = urlParams.get('title');

    function renderLayout(layout) {
      if (!layout || !Array.isArray(layout.elements)) return;
      canvas.innerHTML = '';

      layout.elements.forEach(item => {
        if (item.visible === false) return;

        const container = document.createElement('div');
        container.className = `canvas-item item-${item.type}`;
        container.id = item.id;
        container.style.left = `${item.x}%`;
        container.style.top = `${item.y}%`;
        container.style.width = `${item.w}%`;
        container.style.height = `${item.h}%`;

        if (item.type === 'header') {
          const streamTitle = queryTitle || item.subtitle || 'Live Broadcast';
          container.innerHTML = `
            <div class="overlay-header">
              <div class="live-pill">
                <span class="pulse-dot"></span>
                <span class="live-text">${escapeHtml(item.title || 'TIKTOK LIVE')}</span>
              </div>
              <h1 class="stream-title" style="font-size: ${item.fontSize || 24}px; color: ${item.color || '#ffffff'};">
                ${escapeHtml(streamTitle)}
              </h1>
            </div>
          `;
        } else if (item.type === 'clock') {
          container.innerHTML = `
            <div class="center-content">
              <div class="clock-display" id="liveClockDisplay" style="font-size: ${item.fontSize || 44}px; color: ${item.color || '#ffffff'};">00:00:00</div>
              <div class="wave-container">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
              </div>
            </div>
          `;
        } else if (item.type === 'banner') {
          container.innerHTML = `
            <div class="banner-card" style="background: ${item.bgColor || 'rgba(30, 41, 59, 0.7)'}; border-color: rgba(255,255,255,0.14);">
              <div class="banner-title" style="color: ${item.color || '#38bdf8'}; font-size: ${item.fontSize || 15}px;">
                ${escapeHtml(item.title)}
              </div>
              ${item.subtitle ? `<div class="banner-sub">${escapeHtml(item.subtitle)}</div>` : ''}
            </div>
          `;
        } else if (item.type === 'text') {
          container.innerHTML = `
            <div class="custom-text-box" style="background: ${item.bgColor || 'transparent'}; color: ${item.color || '#ffffff'}; font-size: ${item.fontSize || 20}px;">
              ${escapeHtml(item.title)}
            </div>
          `;
        } else if (item.type === 'marquee') {
          container.innerHTML = `
            <div class="marquee-wrapper" style="background: ${item.bgColor || 'rgba(15, 23, 42, 0.75)'}; color: ${item.color || '#38bdf8'};">
              <div class="marquee-track" style="font-size: ${item.fontSize || 14}px;">
                <span>${escapeHtml(item.title)}</span>
                <span class="marquee-spacer">✦</span>
                <span>${escapeHtml(item.title)}</span>
                <span class="marquee-spacer">✦</span>
              </div>
            </div>
          `;
        }

        canvas.appendChild(container);
      });

      updateClock();
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.toString()
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // BroadcastChannel for instant live updates from the dashboard
    try {
      const channel = new BroadcastChannel('tiktok_overlay_channel');
      channel.onmessage = (e) => {
        if (e.data && e.data.type === 'LAYOUT_UPDATED' && e.data.layout) {
          renderLayout(e.data.layout);
        }
      };
    } catch (err) {}

    // Polling for headless / remote instances
    async function fetchLayout() {
      try {
        const res = await fetch('/api/overlay/layout?_t=' + Date.now());
        const data = await res.json();
        if (data.ok && data.layout) {
          renderLayout(data.layout);
        }
      } catch (err) {
        // Fallback default
        if (!canvas.children.length) renderLayout(DEFAULT_LAYOUT);
      }
    }

    // Clock Interval
    if (!clockInterval) {
      clockInterval = setInterval(updateClock, 1000);
    }

    // Immediate synchronous render of default elements so screen is never blank/black
    renderLayout(DEFAULT_LAYOUT);

    // Initial fetch to load saved studio layout & custom text
    fetchLayout();
    setInterval(fetchLayout, 3000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>TikTok LIVE Stream Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      cursor: none !important; /* Hide mouse cursor completely */
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #09090b 70%, #030712 100%);
      font-family: 'Outfit', sans-serif;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 32px;
      position: relative;
    }

    /* Ambient Background Glow */
    .ambient-glow-1 {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, transparent 70%);
      filter: blur(50px);
      z-index: 1;
      pointer-events: none;
    }

    .ambient-glow-2 {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, transparent 70%);
      filter: blur(60px);
      z-index: 1;
      pointer-events: none;
    }

    /* Header */
    .overlay-header {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 8px 20px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.3);
    }

    .pulse-dot {
      width: 12px;
      height: 12px;
      background-color: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 12px #ef4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    .live-text {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fca5a5;
      text-transform: uppercase;
    }

    .stream-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #ffffff 30%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(192, 132, 252, 0.3);
      line-height: 1.2;
    }

    /* Center Content / Audio Waves */
    .center-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .clock-display {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 54px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 35px rgba(255, 255, 255, 0.3);
    }

    .wave-container {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 60px;
    }

    .wave-bar {
      width: 6px;
      background: linear-gradient(180deg, #a855f7, #38bdf8);
      border-radius: 999px;
      animation: wave 1.2s ease-in-out infinite alternate;
    }

    .wave-bar:nth-child(1) { height: 25px; animation-delay: 0.1s; }
    .wave-bar:nth-child(2) { height: 45px; animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { height: 35px; animation-delay: 0.4s; }
    .wave-bar:nth-child(4) { height: 55px; animation-delay: 0.3s; }
    .wave-bar:nth-child(5) { height: 30px; animation-delay: 0.5s; }
    .wave-bar:nth-child(6) { height: 48px; animation-delay: 0.15s; }
    .wave-bar:nth-child(7) { height: 20px; animation-delay: 0.35s; }

    @keyframes wave {
      0% { transform: scaleY(0.4); }
      100% { transform: scaleY(1.3); }
    }

    /* Footer Glass Card */
    .footer-card {
      position: relative;
      z-index: 10;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 18px 24px;
      backdrop-filter: blur(16px);
      text-align: center;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .footer-highlight {
      font-weight: 700;
      font-size: 16px;
      color: #38bdf8;
      margin-bottom: 4px;
    }

    .footer-sub {
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <!-- Header -->
  <header class="overlay-header">
    <div class="live-pill">
      <span class="pulse-dot"></span>
      <span class="live-text">TIKTOK LIVE</span>
    </div>
    <h1 class="stream-title" id="streamTitleText">Live Broadcast</h1>
  </header>

  <!-- Center Content -->
  <main class="center-content">
    <div class="clock-display" id="clockText">00:00:00</div>
    <div class="wave-container">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer-card">
    <div class="footer-highlight">✨ Selamat Datang di Siaran Live!</div>
    <div class="footer-sub">Jangan lupa follow, like, dan tap-tap layarnya ya!</div>
  </footer>

  <script>
    // Live Clock
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clockText').textContent = `${h}:${m}:${s}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Query param title override support: ?title=My+Stream+Title
    const urlParams = new URLSearchParams(window.location.search);
    const title = urlParams.get('title');
    if (title) {
      document.getElementById('streamTitleText').textContent = title;
    }
  </script>
</body>
</html>
